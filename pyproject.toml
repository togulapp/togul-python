[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "togul"
version = "0.1.0"
description = "Official Python SDK for Togul feature flags and remote config"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Togul" }]
keywords = ["feature-flags", "feature-toggle", "remote-config", "togul"]
dependencies = ["httpx>=0.24,<1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.100"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://togul.io"
Documentation = "https://docs.togul.io"
Source = "https://github.com/togulapp/togul-python"

[tool.hatch.build.targets.wheel]
packages = ["src/togul"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP006/UP007/UP035/UP045 would rewrite typing.Optional/Dict/List into PEP 604/585
# syntax. `from __future__ import annotations` makes that parse on 3.9, but it
# breaks anywhere annotations are evaluated at runtime (typing.get_type_hints,
# pydantic, FastAPI dependency resolution). The 3.9 floor keeps typing.*.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
# No python_version pin: mypy >= 1.18 rejects 3.9 as a target. 3.9 compatibility
# is guarded by ruff's target-version = "py39" and by the 3.9 leg of the CI matrix.
strict = true
files = ["src/togul"]
